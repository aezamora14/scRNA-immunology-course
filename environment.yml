# Course environment for the Python track.
#   conda env create -f environment.yml
#   conda activate scimmuno
name: scimmuno
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pip
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - seaborn
  - jupyterlab
  - ipywidgets
  - leidenalg
  - python-igraph
  - h5py
  - pytables
  - scanpy>=1.10
  - anndata>=0.10
  - mudata
  - scirpy>=0.17
  - harmonypy
  - scrublet
  - celltypist
  - decoupler
  - pydeseq2
  - pip:
      - pertpy          # scCODA and other perturbation tools
      - scvi-tools      # optional; needs PyTorch, GPU recommended
