<text x="645" y="245" font-size="11" text-anchor="start" fill="#666" font-weight="normal" >top bar: CP10k   ·   bottom bar: log</text>
<text x="640" y="275" font-size="11" text-anchor="start" fill="#222" font-weight="normal" >B2M is 700× GZMB in counts but only 5×</text>
<text x="640" y="290" font-size="11" text-anchor="start" fill="#222" font-weight="normal" >in log space, so one abundant gene no</text>
<text x="640" y="305" font-size="11" text-anchor="start" fill="#222" font-weight="normal" >longer dominates every distance.</text>
<text x="20" y="330" font-size="11" text-anchor="start" fill="#666" font-weight="normal" >Analogy: comparing two books of 100 and 500 pages by 'pages about T cells' is meaningless; comparing 'fraction of pages' is fair. The log then</text>
<text x="20" y="345" font-size="11" text-anchor="start" fill="#666" font-weight="normal" >treats a 2× change the same whether the gene is rare or abundant.</text>

