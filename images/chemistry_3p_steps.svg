<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 615" width="100%" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#222" role="img">
<rect width="900" height="615" fill="#fff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker><marker id="ahk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="26" font-size="16" text-anchor="start" fill="#222" font-weight="700" >3′ chemistry: how the barcode gets onto a transcript</text>
<text x="20" y="44" font-size="11" text-anchor="start" fill="#666" font-weight="normal" >Everything happens inside one droplet. One bead = one barcode = one cell.</text>
<text x="20" y="76" font-size="12" text-anchor="start" fill="#222" font-weight="600" >Start</text>
<circle cx="70" cy="105" r="22" fill="#b3e5fc"/><text x="70" y="103" font-size="10" text-anchor="middle" fill="#222" font-weight="normal" >Gel</text>
<text x="70" y="114" font-size="10" text-anchor="middle" fill="#222" font-weight="normal" >bead</text>
<line x1="92" y1="105" x2="110" y2="105" stroke="#b3e5fc" stroke-width="4"/>
<rect x="110" y="98.0" width="60" height="14" rx="4" fill="#263238"/>
<text x="140.0" y="109" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >Read 1</text>
<rect x="172" y="98.0" width="55" height="14" rx="4" fill="#7cb342"/>
<text x="199.5" y="109" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >Barcode</text>
<rect x="229" y="98.0" width="38" height="14" rx="4" fill="#e76f51"/>
<text x="248.0" y="109" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >UMI</text>
<rect x="269" y="98.0" width="62" height="14" rx="4" fill="#3f51b5"/>
<text x="300.0" y="109" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >TTTTTTTT</text>
<text x="300" y="91" font-size="10" text-anchor="middle" fill="#3f51b5" font-weight="700" >poly(dT)</text>
<line x1="470" y1="105" x2="730" y2="105" stroke="#9e9e9e" stroke-width="10" stroke-dasharray="3,3"/>
<text x="464" y="109" font-size="10" text-anchor="end" fill="#666" font-weight="700" >5′</text>
<rect x="730" y="98.0" width="60" height="14" rx="4" fill="#7986cb"/>
<text x="760.0" y="109" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >AAAAAAAA</text>
<text x="796" y="109" font-size="10" text-anchor="start" fill="#666" font-weight="700" >3′</text>
<text x="600.0" y="91" font-size="10" text-anchor="middle" fill="#666" font-weight="700" >mRNA</text>
<text x="110" y="139" font-size="11" text-anchor="start" fill="#666" font-weight="normal" >The bead oligo ends in poly(dT). Millions of copies per bead share one barcode; each copy has its own UMI.</text>
<line x1="40" y1="163" x2="40" y2="191" stroke="#666" stroke-width="2" marker-end="url(#ah)"/>
<text x="52" y="179" font-size="12" text-anchor="start" fill="#222" font-weight="600" >1. Poly(dT) anneals to the poly(A) tail</text>
<circle cx="70" cy="215" r="22" fill="#b3e5fc"/><text x="70" y="213" font-size="10" text-anchor="middle" fill="#222" font-weight="normal" >Gel</text>
<text x="70" y="224" font-size="10" text-anchor="middle" fill="#222" font-weight="normal" >bead</text>
<line x1="92" y1="215" x2="110" y2="215" stroke="#b3e5fc" stroke-width="4"/>
<rect x="110" y="208.0" width="60" height="14" rx="4" fill="#263238"/>
<text x="140.0" y="219" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >Read 1</text>
<rect x="172" y="208.0" width="55" height="14" rx="4" fill="#7cb342"/>
<text x="199.5" y="219" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >Barcode</text>
<rect x="229" y="208.0" width="38" height="14" rx="4" fill="#e76f51"/>
<text x="248.0" y="219" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >UMI</text>
<rect x="269" y="208.0" width="62" height="14" rx="4" fill="#3f51b5"/>
<text x="300.0" y="219" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >TTTTTTTT</text>
<rect x="269" y="186.0" width="62" height="14" rx="4" fill="#7986cb"/>
<text x="300.0" y="197" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >AAAAAAAA</text>
<line x1="274.0" y1="196" x2="274.0" y2="203" stroke="#222"/><line x1="290.5" y1="196" x2="290.5" y2="203" stroke="#222"/><line x1="307.0" y1="196" x2="307.0" y2="203" stroke="#222"/><line x1="323.5" y1="196" x2="323.5" y2="203" stroke="#222"/><line x1="331" y1="193" x2="591" y2="193" stroke="#9e9e9e" stroke-width="10" stroke-dasharray="3,3"/><text x="597" y="197" font-size="10" text-anchor="start" fill="#666" font-weight="700" >5′</text>
<text x="261" y="197" font-size="10" text-anchor="end" fill="#666" font-weight="700" >3′</text>
<text x="110" y="249" font-size="11" text-anchor="start" fill="#666" font-weight="normal" >Strands pair antiparallel, so the mRNA's 5′ end points away from the bead.</text>
<line x1="40" y1="273" x2="40" y2="301" stroke="#666" stroke-width="2" marker-end="url(#ah)"/>
<text x="52" y="289" font-size="12" text-anchor="start" fill="#222" font-weight="600" >2. Reverse transcriptase copies the mRNA toward its 5′ end</text>
<circle cx="70" cy="325" r="22" fill="#b3e5fc"/><text x="70" y="323" font-size="10" text-anchor="middle" fill="#222" font-weight="normal" >Gel</text>
<text x="70" y="334" font-size="10" text-anchor="middle" fill="#222" font-weight="normal" >bead</text>
<line x1="92" y1="325" x2="110" y2="325" stroke="#b3e5fc" stroke-width="4"/>
<rect x="110" y="318.0" width="60" height="14" rx="4" fill="#263238"/>
<text x="140.0" y="329" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >Read 1</text>
<rect x="172" y="318.0" width="55" height="14" rx="4" fill="#7cb342"/>
<text x="199.5" y="329" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >Barcode</text>
<rect x="229" y="318.0" width="38" height="14" rx="4" fill="#e76f51"/>
<text x="248.0" y="329" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >UMI</text>
<rect x="269" y="318.0" width="62" height="14" rx="4" fill="#3f51b5"/>
<text x="300.0" y="329" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >TTTTTTTT</text>
<rect x="269" y="296.0" width="62" height="14" rx="4" fill="#7986cb"/>
<text x="300.0" y="307" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >AAAAAAAA</text>
<line x1="331" y1="303" x2="591" y2="303" stroke="#9e9e9e" stroke-width="10" stroke-dasharray="3,3"/><text x="597" y="307" font-size="10" text-anchor="start" fill="#666" font-weight="700" >5′</text>
<line x1="331" y1="325" x2="591" y2="325" stroke="#1a237e" stroke-width="10"/>
<text x="461.0" y="316" font-size="10" text-anchor="middle" fill="#1a237e" font-weight="600" >first-strand cDNA</text>
<text x="597" y="329" font-size="10" text-anchor="start" fill="#1a237e" font-weight="700" >CCC</text>
<text x="110" y="359" font-size="11" text-anchor="start" fill="#666" font-weight="normal" >When RT runs off the 5′ cap it adds a few untemplated C's to the end of the cDNA.</text>
<line x1="40" y1="383" x2="40" y2="411" stroke="#666" stroke-width="2" marker-end="url(#ah)"/>
<text x="52" y="399" font-size="12" text-anchor="start" fill="#222" font-weight="600" >3. A free TSO anneals to the CCC; RT switches template and copies the TSO</text>
<circle cx="70" cy="435" r="22" fill="#b3e5fc"/><text x="70" y="433" font-size="10" text-anchor="middle" fill="#222" font-weight="normal" >Gel</text>
<text x="70" y="444" font-size="10" text-anchor="middle" fill="#222" font-weight="normal" >bead</text>
<line x1="92" y1="435" x2="110" y2="435" stroke="#b3e5fc" stroke-width="4"/>
<rect x="110" y="428.0" width="60" height="14" rx="4" fill="#263238"/>
<text x="140.0" y="439" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >Read 1</text>
<rect x="172" y="428.0" width="55" height="14" rx="4" fill="#7cb342"/>
<text x="199.5" y="439" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >Barcode</text>
<rect x="229" y="428.0" width="38" height="14" rx="4" fill="#e76f51"/>
<text x="248.0" y="439" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >UMI</text>
<rect x="269" y="428.0" width="62" height="14" rx="4" fill="#3f51b5"/>
<text x="300.0" y="439" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >TTTTTTTT</text>
<line x1="331" y1="413" x2="591" y2="413" stroke="#9e9e9e" stroke-width="10" stroke-dasharray="3,3" opacity="0.45"/><text x="593" y="417" font-size="9" text-anchor="start" fill="#26a69a" font-weight="700" >rGrGrG</text>
<rect x="631" y="406.0" width="50" height="14" rx="4" fill="#26a69a"/>
<text x="656.0" y="417" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >TSO</text>
<line x1="598.0" y1="416" x2="598.0" y2="423" stroke="#222"/><line x1="611.5" y1="416" x2="611.5" y2="423" stroke="#222"/><line x1="625.0" y1="416" x2="625.0" y2="423" stroke="#222"/><line x1="331" y1="435" x2="591" y2="435" stroke="#1a237e" stroke-width="10"/>
<text x="593" y="439" font-size="9" text-anchor="start" fill="#1a237e" font-weight="700" >CCC</text>
<rect x="631" y="428.0" width="50" height="14" rx="4" fill="#26a69a"/>
<text x="656.0" y="439" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >TSO′</text>
<text x="110" y="469" font-size="11" text-anchor="start" fill="#666" font-weight="normal" >In the 3′ kit the TSO is a free oligo in the reaction mix; it just caps the far end of the cDNA.</text>
<text x="20" y="511" font-size="12" text-anchor="start" fill="#222" font-weight="600" >Result: barcoded cDNA</text>
<rect x="110" y="528.0" width="60" height="14" rx="4" fill="#263238"/>
<text x="140.0" y="539" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >Read 1</text>
<rect x="172" y="528.0" width="55" height="14" rx="4" fill="#7cb342"/>
<text x="199.5" y="539" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >Barcode</text>
<rect x="229" y="528.0" width="38" height="14" rx="4" fill="#e76f51"/>
<text x="248.0" y="539" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >UMI</text>
<rect x="269" y="528.0" width="62" height="14" rx="4" fill="#3f51b5"/>
<text x="300.0" y="539" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >poly(dT)</text>
<rect x="333" y="528.0" width="300" height="14" rx="4" fill="#1a237e"/>
<text x="483.0" y="539" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >transcript, copied 3′ → 5′</text>
<rect x="635" y="528.0" width="50" height="14" rx="4" fill="#26a69a"/>
<text x="660.0" y="539" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >TSO</text>
<path d="M335,545 L335,553 L400,553 L400,545" fill="none" stroke="#222"/><text x="367" y="566" font-size="10" text-anchor="middle" fill="#222" font-weight="700" >3′ end of gene</text>
<path d="M570,545 L570,553 L632,553 L632,545" fill="none" stroke="#222"/><text x="601" y="566" font-size="10" text-anchor="middle" fill="#222" font-weight="700" >5′ end of gene</text>
<text x="20" y="593" font-size="12" text-anchor="start" fill="#222" font-weight="600" >Barcode and UMI sit beside the gene's 3′ end. Sequencing starts at Read 1, so the ~100 nt read are the gene's 3′ end.</text>
</svg>