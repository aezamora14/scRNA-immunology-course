<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 615" width="100%" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#222" role="img">
<rect width="900" height="615" fill="#fff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker><marker id="ahk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="26" font-size="16" text-anchor="start" fill="#222" font-weight="700" >5′ chemistry: the same ingredients, rearranged</text>
<text x="20" y="44" font-size="11" text-anchor="start" fill="#666" font-weight="normal" >The poly(dT) primer is now free in solution and the template-switch oligo is on the bead.</text>
<text x="20" y="76" font-size="12" text-anchor="start" fill="#222" font-weight="600" >Start</text>
<circle cx="70" cy="105" r="22" fill="#b3e5fc"/><text x="70" y="103" font-size="10" text-anchor="middle" fill="#222" font-weight="normal" >Gel</text>
<text x="70" y="114" font-size="10" text-anchor="middle" fill="#222" font-weight="normal" >bead</text>
<line x1="92" y1="105" x2="110" y2="105" stroke="#b3e5fc" stroke-width="4"/>
<rect x="110" y="98.0" width="60" height="14" rx="4" fill="#263238"/>
<text x="140.0" y="109" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >Read 1</text>
<rect x="172" y="98.0" width="55" height="14" rx="4" fill="#7cb342"/>
<text x="199.5" y="109" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >Barcode</text>
<rect x="229" y="98.0" width="38" height="14" rx="4" fill="#e76f51"/>
<text x="248.0" y="109" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >UMI</text>
<rect x="269" y="98.0" width="62" height="14" rx="4" fill="#26a69a"/>
<text x="300.0" y="109" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >TSO</text>
<text x="335" y="109" font-size="10" text-anchor="start" fill="#26a69a" font-weight="700" >rGrGrG</text>
<line x1="470" y1="105" x2="700" y2="105" stroke="#9e9e9e" stroke-width="10" stroke-dasharray="3,3"/>
<text x="464" y="109" font-size="10" text-anchor="end" fill="#666" font-weight="700" >5′</text>
<rect x="700" y="98.0" width="60" height="14" rx="4" fill="#7986cb"/>
<text x="730.0" y="109" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >AAAAAAAA</text>
<text x="766" y="109" font-size="10" text-anchor="start" fill="#666" font-weight="700" >3′</text>
<rect x="760" y="122.0" width="62" height="14" rx="4" fill="#3f51b5"/>
<text x="791.0" y="133" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >TTTTTTTT</text>
<text x="791" y="149" font-size="10" text-anchor="middle" fill="#3f51b5" font-weight="700" >free poly(dT) primer</text>
<text x="110" y="139" font-size="11" text-anchor="start" fill="#666" font-weight="normal" >The bead oligo ends in a TSO whose last three bases are riboguanosines (rGrGrG).</text>
<line x1="40" y1="163" x2="40" y2="191" stroke="#666" stroke-width="2" marker-end="url(#ah)"/>
<text x="52" y="179" font-size="12" text-anchor="start" fill="#222" font-weight="600" >1. Free poly(dT) primes RT; cDNA is copied toward the 5′ end and RT adds CCC</text>
<circle cx="70" cy="215" r="22" fill="#b3e5fc"/><text x="70" y="213" font-size="10" text-anchor="middle" fill="#222" font-weight="normal" >Gel</text>
<text x="70" y="224" font-size="10" text-anchor="middle" fill="#222" font-weight="normal" >bead</text>
<line x1="92" y1="215" x2="110" y2="215" stroke="#b3e5fc" stroke-width="4"/>
<rect x="110" y="208.0" width="60" height="14" rx="4" fill="#263238"/>
<text x="140.0" y="219" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >Read 1</text>
<rect x="172" y="208.0" width="55" height="14" rx="4" fill="#7cb342"/>
<text x="199.5" y="219" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >Barcode</text>
<rect x="229" y="208.0" width="38" height="14" rx="4" fill="#e76f51"/>
<text x="248.0" y="219" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >UMI</text>
<rect x="269" y="208.0" width="62" height="14" rx="4" fill="#26a69a"/>
<text x="300.0" y="219" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >TSO</text>
<text x="335" y="219" font-size="10" text-anchor="start" fill="#26a69a" font-weight="700" >rGrGrG</text>
<line x1="470" y1="204" x2="700" y2="204" stroke="#9e9e9e" stroke-width="10" stroke-dasharray="3,3"/>
<text x="464" y="208" font-size="10" text-anchor="end" fill="#666" font-weight="700" >5′</text>
<rect x="700" y="197.0" width="60" height="14" rx="4" fill="#7986cb"/>
<text x="730.0" y="208" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >AAAAAAAA</text>
<text x="766" y="208" font-size="10" text-anchor="start" fill="#666" font-weight="700" >3′</text>
<line x1="470" y1="226" x2="700" y2="226" stroke="#1a237e" stroke-width="10"/>
<rect x="700" y="219.0" width="62" height="14" rx="4" fill="#3f51b5"/>
<text x="731.0" y="230" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >TTTTTTTT</text>
<text x="464" y="230" font-size="10" text-anchor="end" fill="#1a237e" font-weight="700" >CCC</text>
<text x="585" y="245" font-size="10" text-anchor="middle" fill="#1a237e" font-weight="600" >first-strand cDNA</text>
<text x="110" y="249" font-size="11" text-anchor="start" fill="#666" font-weight="normal" >So far nothing has touched the bead. The cDNA is not yet barcoded.</text>
<line x1="40" y1="273" x2="40" y2="301" stroke="#666" stroke-width="2" marker-end="url(#ah)"/>
<text x="52" y="289" font-size="12" text-anchor="start" fill="#222" font-weight="600" >2. The cDNA's CCC end anneals to the bead's rGrGrG</text>
<circle cx="70" cy="325" r="22" fill="#b3e5fc"/><text x="70" y="323" font-size="10" text-anchor="middle" fill="#222" font-weight="normal" >Gel</text>
<text x="70" y="334" font-size="10" text-anchor="middle" fill="#222" font-weight="normal" >bead</text>
<line x1="92" y1="325" x2="110" y2="325" stroke="#b3e5fc" stroke-width="4"/>
<rect x="110" y="318.0" width="60" height="14" rx="4" fill="#263238"/>
<text x="140.0" y="329" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >Read 1</text>
<rect x="172" y="318.0" width="55" height="14" rx="4" fill="#7cb342"/>
<text x="199.5" y="329" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >Barcode</text>
<rect x="229" y="318.0" width="38" height="14" rx="4" fill="#e76f51"/>
<text x="248.0" y="329" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >UMI</text>
<rect x="269" y="318.0" width="62" height="14" rx="4" fill="#26a69a"/>
<text x="300.0" y="329" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >TSO</text>
<text x="334" y="323" font-size="9" text-anchor="start" fill="#26a69a" font-weight="700" >rGrGrG</text>
<text x="374" y="344" font-size="9" text-anchor="end" fill="#1a237e" font-weight="700" >CCC</text>
<line x1="377" y1="314" x2="607" y2="314" stroke="#9e9e9e" stroke-width="10" stroke-dasharray="3,3"/>
<rect x="607" y="307.0" width="60" height="14" rx="4" fill="#7986cb"/>
<text x="637.0" y="318" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >AAAAAAAA</text>
<text x="673" y="318" font-size="10" text-anchor="start" fill="#666" font-weight="700" >3′</text>
<text x="374" y="318" font-size="9" text-anchor="end" fill="#666" font-weight="700" >5′</text>
<line x1="377" y1="336" x2="607" y2="336" stroke="#1a237e" stroke-width="10"/>
<rect x="607" y="329.0" width="62" height="14" rx="4" fill="#3f51b5"/>
<text x="638.0" y="340" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >TTTTTTTT</text>
<line x1="340.0" y1="323" x2="340.0" y2="330" stroke="#222"/><line x1="353.5" y1="323" x2="353.5" y2="330" stroke="#222"/><line x1="367.0" y1="323" x2="367.0" y2="330" stroke="#222"/><text x="110" y="359" font-size="11" text-anchor="start" fill="#666" font-weight="normal" >The end of the cDNA corresponds to the transcript's 5′ end, and that is what docks onto the bead.</text>
<line x1="40" y1="383" x2="40" y2="411" stroke="#666" stroke-width="2" marker-end="url(#ah)"/>
<text x="52" y="399" font-size="12" text-anchor="start" fill="#222" font-weight="600" >3. RT extends the cDNA across the TSO, copying barcode and UMI into it</text>
<circle cx="70" cy="431" r="22" fill="#b3e5fc"/><text x="70" y="429" font-size="10" text-anchor="middle" fill="#222" font-weight="normal" >Gel</text>
<text x="70" y="440" font-size="10" text-anchor="middle" fill="#222" font-weight="normal" >bead</text>
<line x1="92" y1="431" x2="110" y2="431" stroke="#b3e5fc" stroke-width="4"/>
<rect x="110" y="424.0" width="60" height="14" rx="4" fill="#263238"/>
<text x="140.0" y="435" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >Read 1</text>
<rect x="172" y="424.0" width="55" height="14" rx="4" fill="#7cb342"/>
<text x="199.5" y="435" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >Barcode</text>
<rect x="229" y="424.0" width="38" height="14" rx="4" fill="#e76f51"/>
<text x="248.0" y="435" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >UMI</text>
<rect x="269" y="424.0" width="62" height="14" rx="4" fill="#26a69a"/>
<text x="300.0" y="435" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >TSO</text>
<line x1="333" y1="417" x2="563" y2="417" stroke="#9e9e9e" stroke-width="10" stroke-dasharray="3,3"/>
<rect x="563" y="410.0" width="60" height="14" rx="4" fill="#7986cb"/>
<text x="593.0" y="421" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >AAAAAAAA</text>
<text x="629" y="421" font-size="10" text-anchor="start" fill="#666" font-weight="700" >3′</text>
<rect x="110" y="443.0" width="60" height="12" rx="4" fill="#263238"/>
<text x="140.0" y="453" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >Read 1′</text>
<rect x="172" y="443.0" width="55" height="12" rx="4" fill="#7cb342"/>
<text x="199.5" y="453" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >Barcode′</text>
<rect x="229" y="443.0" width="38" height="12" rx="4" fill="#e76f51"/>
<text x="248.0" y="453" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >UMI′</text>
<rect x="269" y="443.0" width="62" height="12" rx="4" fill="#26a69a"/>
<text x="300.0" y="453" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >TSO′</text>
<line x1="333" y1="449" x2="563" y2="449" stroke="#1a237e" stroke-width="10"/>
<rect x="563" y="442.0" width="62" height="14" rx="4" fill="#3f51b5"/>
<text x="594.0" y="453" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >TTTTTTTT</text>
<line x1="335" y1="433" x2="335" y2="443" stroke="#222" stroke-dasharray="2,2"/><text x="112" y="469" font-size="10" text-anchor="start" fill="#1a237e" font-weight="600" >← newly synthesised copy of the bead oligo, now joined to the cDNA</text>
<text x="110" y="485" font-size="11" text-anchor="start" fill="#666" font-weight="normal" >The lower strand now runs Read 1 · barcode · UMI · TSO · transcript · poly(dT) as one molecule.</text>
<text x="20" y="511" font-size="12" text-anchor="start" fill="#222" font-weight="600" >Result: barcoded cDNA</text>
<rect x="110" y="528.0" width="60" height="14" rx="4" fill="#263238"/>
<text x="140.0" y="539" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >Read 1</text>
<rect x="172" y="528.0" width="55" height="14" rx="4" fill="#7cb342"/>
<text x="199.5" y="539" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >Barcode</text>
<rect x="229" y="528.0" width="38" height="14" rx="4" fill="#e76f51"/>
<text x="248.0" y="539" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >UMI</text>
<rect x="269" y="528.0" width="50" height="14" rx="4" fill="#26a69a"/>
<text x="294.0" y="539" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >TSO</text>
<rect x="321" y="528.0" width="300" height="14" rx="4" fill="#1a237e"/>
<text x="471.0" y="539" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >transcript, 5′ → 3′</text>
<rect x="623" y="528.0" width="62" height="14" rx="4" fill="#3f51b5"/>
<text x="654.0" y="539" font-size="10" text-anchor="middle" fill="#fff" font-weight="700" >poly(dT)</text>
<path d="M323,545 L323,553 L388,553 L388,545" fill="none" stroke="#222"/><text x="355" y="566" font-size="10" text-anchor="middle" fill="#222" font-weight="700" >5′ end of gene</text>
<path d="M558,545 L558,553 L620,553 L620,545" fill="none" stroke="#222"/><text x="589" y="566" font-size="10" text-anchor="middle" fill="#222" font-weight="700" >3′ end of gene</text>
<text x="20" y="593" font-size="12" text-anchor="start" fill="#222" font-weight="600" >Barcode and UMI now sit beside the gene's 5′ end. Sequencing from Read 1 reads the 5′ end of the gene.</text>
</svg>